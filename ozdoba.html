<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Оздоба — комплектація інтер'єрів з Китаю | CAS Development</title>
<meta name="description" content="Оздоба від CAS Development: світло, меблі, декор і матеріали для квартир, кафе, ресторанів, офісів і готелів. Комплекти під обʼєкт, доставка по Україні, рахунок для ФОП і ТОВ.">
<link rel="canonical" href="https://cas-develop.com/ozdoba">
<meta property="og:type" content="website">
<meta property="og:title" content="Оздоба — комплектація інтер'єрів | CAS Development">
<meta property="og:description" content="Світло, меблі, декор і матеріали під ваш обʼєкт: квартира, кафе, ресторан, офіс, готель.">
<meta property="og:url" content="https://cas-develop.com/ozdoba">
<meta property="og:locale" content="uk_UA">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --ink:#17120E; --surface:#211A15; --surface-2:#2C231C; --line:#3A2E25;
  --brass:#C79A4E; --glow:#FFD29A; --cream:#EFE7DA; --muted:#988A7A;
  --ok:#86B06A; --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--cream);font-family:"Manrope",system-ui,sans-serif;
  font-size:15px;line-height:1.5;padding-bottom:104px;overscroll-behavior-y:contain}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;letter-spacing:.01em;margin:0}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
input,select{font:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:0;z-index:40;background:var(--ink);
  padding:12px 16px 10px;display:flex;align-items:center;gap:9px;border-bottom:1px solid transparent}
.top.stuck{border-bottom-color:var(--line)}
.brand{font-family:"Cormorant Garamond",serif;font-size:24px;line-height:1;flex:1}
.brand span{color:var(--brass)}
.ico{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;
  background:var(--surface);position:relative}
.ico svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.on{border-color:var(--brass)}
.ico.on svg{stroke:var(--glow)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;
  background:var(--brass);color:#1B1408;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

.searchwrap{padding:0 16px 10px;display:none}
.searchwrap.on{display:block}
.searchwrap input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;color:var(--cream)}

/* venues */
.vhead{padding:4px 16px 8px;font-size:11.5px;color:var(--muted)}
.venues{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}
.venues::-webkit-scrollbar{display:none}
.venue{flex:0 0 auto;width:104px;border:1px solid var(--line);border-radius:13px;padding:11px 10px 10px;
  background:var(--surface);display:flex;flex-direction:column;gap:7px}
.venue svg{width:22px;height:22px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.venue b{font-weight:600;font-size:12.5px;line-height:1.25}
.venue em{font-style:normal;font-size:10.5px;color:var(--muted)}
.venue[aria-pressed="true"]{border-color:var(--brass);background:var(--surface-2)}
.venue[aria-pressed="true"] b{color:var(--glow)}

/* tabs */
.tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:9px 0 11px;font-size:14px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-pressed="true"]{color:var(--cream);border-bottom-color:var(--brass)}

/* toolbar */
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1B1509;font-weight:600}
.sortrow{display:flex;align-items:center;justify-content:space-between;padding:0 16px 12px;gap:12px}
.sortrow .cnt{font-size:12px;color:var(--muted)}
.sortrow select{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;color:var(--cream);font-size:12.5px}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr);max-width:1000px;margin:0 auto}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;position:relative}
.card:active{border-color:var(--brass)}
.tile{position:relative;aspect-ratio:4/3;display:grid;place-items:center;color:var(--brass);
  background:radial-gradient(60% 70% at 50% 42%,#3B2E22 0%,#221A14 62%,#1B1510 100%)}
.tile svg{width:66%;height:66%;overflow:visible}
.tile::after{content:"";position:absolute;inset:0;
  background:radial-gradient(45% 45% at 50% 40%,rgba(255,210,154,.15),transparent 70%)}
.heart{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:50%;
  background:rgba(23,18,14,.66);display:grid;place-items:center;z-index:2}
.heart svg{width:15px;height:15px;stroke:var(--cream);fill:none;stroke-width:1.9}
.heart.on svg{fill:var(--brass);stroke:var(--brass)}
.card .body{padding:9px 11px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .nm{font-family:"Cormorant Garamond",serif;font-size:16.5px;line-height:1.2}
.card .sub{font-size:10.5px;color:var(--muted)}
.card .pr{margin-top:auto;padding-top:5px;font-weight:700;font-size:14px;color:var(--glow)}
.card .pr small{font-weight:500;color:var(--muted);font-size:11px}
.sw{display:flex;gap:3px;margin-top:5px}
.sw i{width:11px;height:11px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.18)}

/* bundles */
.blist{padding:0 14px;display:grid;gap:11px}
@media(min-width:700px){.blist{grid-template-columns:1fr 1fr;max-width:1000px;margin:0 auto}}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  display:flex;gap:12px;padding:12px;align-items:center}
.bcard:active{border-color:var(--brass)}
.bcard .art{width:74px;height:74px;flex:0 0 74px;border-radius:11px;display:grid;place-items:center;color:var(--brass);
  background:radial-gradient(62% 70% at 50% 44%,#3E3025,#1D1610)}
.bcard .art svg{width:60%;height:60%}
.bcard .info{flex:1;min-width:0}
.bcard h3{font-size:19px;line-height:1.15;margin-bottom:3px}
.bcard .note{font-size:11.5px;color:var(--muted);line-height:1.4}
.bcard .pr{margin-top:7px;font-weight:700;font-size:14px;color:var(--glow)}
.bcard .pr s{color:var(--muted);font-weight:500;font-size:12px;margin-left:6px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,7,5,.74);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);max-height:90vh;overflow-y:auto;
  transform:translateY(102%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  padding-bottom:max(18px,env(safe-area-inset-bottom))}
.sheet.open{transform:translateY(0)}
@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
.grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:9px auto 4px}
.sh-pad{padding:6px 18px 18px}
.sh-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
.sh-head h2{font-size:24px;line-height:1.15;flex:1}
.x{font-size:21px;color:var(--muted);line-height:1;padding:2px 6px}

.hero-art{aspect-ratio:16/10;border-radius:12px;display:grid;place-items:center;
  background:radial-gradient(58% 68% at 50% 44%,#3E3025 0%,#241C15 62%,#1B1510 100%);margin-bottom:13px}
.hero-art svg{width:46%;height:46%;overflow:visible;transition:color .22s}
.desc{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0 0 13px;max-width:52ch}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.tag{border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:11.5px;color:var(--muted)}
.lbl{font-size:11.5px;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.lbl b{color:var(--cream);font-weight:600}

.swatches{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);position:relative}
.swatch[aria-pressed="true"]{border-color:var(--brass)}
.opts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:17px}
.opt{border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;color:var(--muted);line-height:1.2}
.opt small{display:block;font-size:10.5px;margin-top:3px;opacity:.75}
.opt[aria-pressed="true"]{border-color:var(--brass);color:var(--glow);background:var(--surface-2)}

.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:fit-content}
.qty button{width:40px;height:40px;font-size:19px;color:var(--brass);text-align:center}
.qty span{min-width:40px;text-align:center;font-weight:700}
.qty.sm button{width:30px;height:30px;font-size:16px}
.qty.sm span{min-width:30px;font-size:13px}

.priceline{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px}
.priceline .big{font-family:"Cormorant Garamond",serif;font-size:32px;color:var(--glow);line-height:1}
.priceline .per{font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0 0 14px}

.btn{display:block;width:100%;text-align:center;background:var(--brass);color:#1B1408;font-weight:700;
  border-radius:12px;padding:15px;font-size:15px;margin-top:12px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--cream);font-weight:600}
.btn2{display:flex;gap:9px}
.btn2 .btn{margin-top:12px}

/* rows */
.ci{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ci .art{width:54px;height:54px;flex:0 0 54px;border-radius:9px;display:grid;place-items:center;color:var(--brass);
  background:radial-gradient(60% 70% at 50% 45%,#3B2E22,#1D1610)}
.ci .art svg{width:60%;height:60%}
.ci .info{flex:1;min-width:0}
.ci .info b{display:block;font-family:"Cormorant Garamond",serif;font-weight:500;font-size:16px;line-height:1.2}
.ci .info em{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:2px}
.ci .right{text-align:right;white-space:nowrap}
.ci .right .s{font-weight:700;font-size:13.5px;color:var(--glow);display:block;margin-bottom:5px}
.rm{font-size:11px;color:var(--muted);font-weight:500;padding:3px 0}

.sum{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;color:var(--muted)}
.sum.disc{color:var(--ok)}
.sum.total{font-size:17px;color:var(--cream);font-weight:700;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.empty{text-align:center;color:var(--muted);padding:44px 24px;font-size:14px;line-height:1.6}
.promo{display:flex;gap:8px;margin:12px 0 4px}
.promo input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--cream);font-size:14px}
.promo button{border:1px solid var(--line);border-radius:10px;padding:0 16px;font-size:13px;font-weight:600}

/* checkout */
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px;color:var(--cream);font-size:15px}
.field input:focus{outline:2px solid var(--brass);outline-offset:-1px;border-color:transparent}
.pay{display:flex;gap:12px;align-items:flex-start;width:100%;border:1px solid var(--line);
  border-radius:12px;padding:13px;margin-bottom:9px;background:var(--ink)}
.pay[aria-pressed="true"]{border-color:var(--brass);background:var(--surface-2)}
.pay .dot{width:17px;height:17px;flex:0 0 17px;border:1.5px solid var(--line);border-radius:50%;margin-top:2px}
.pay[aria-pressed="true"] .dot{border-color:var(--brass);box-shadow:inset 0 0 0 4px var(--brass)}
.pay b{display:block;font-weight:600;font-size:14px}
.pay small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.45}
.banks{display:flex;gap:5px;margin-top:8px}
.banks i{width:19px;height:19px;border-radius:50%;display:block}
.done{text-align:center;padding:28px 10px 10px}
.done .ring{width:56px;height:56px;border-radius:50%;border:2px solid var(--brass);
  display:grid;place-items:center;margin:0 auto 15px;color:var(--brass);font-size:24px}
.demo{border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:12px;
  color:var(--muted);line-height:1.5;margin-top:16px}
.demo code{color:var(--brass);font-size:11.5px}

/* bar + toast */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:12px 16px max(12px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(23,18,14,0),var(--ink) 34%);
  transform:translateY(130%);transition:transform .22s ease}
.bar.show{transform:translateY(0)}
.bar button{width:100%;background:var(--brass);color:#1B1408;font-weight:700;border-radius:13px;
  padding:16px;text-align:center;font-size:15px}
.toast{position:fixed;left:16px;right:16px;bottom:88px;z-index:70;background:var(--surface-2);
  border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:13.5px;
  opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}
.note-honest{color:var(--muted);font-size:12.5px;line-height:1.5;margin:10px 2px 0}
.ozd-info{margin:10px 16px 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted);font-size:12.5px;line-height:1.5}
.ozd-info a{color:var(--brass)}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="brand">Оздоба<span>.</span></div>
  <button class="ico" id="btnSearch" onclick="toggleSearch()" aria-label="Пошук">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg></button>
  <button class="ico" onclick="setTab('fav')" aria-label="Обране">
    <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.7A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7 3.3C19 15.4 12 20 12 20z"/></svg>
    <span class="badge" id="favBadge" hidden>0</span></button>
  <button class="ico" onclick="openCart()" aria-label="Кошик">
    <svg viewBox="0 0 24 24"><path d="M4 5h2l2.2 10.4A2 2 0 0 0 10.2 17h7.4a2 2 0 0 0 2-1.6L21 8H6.3"/><circle cx="10.5" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg>
    <span class="badge" id="cartBadge" hidden>0</span></button>
</header>

<div class="searchwrap" id="searchwrap">
  <input id="q" type="search" placeholder="Знайти: бра, стілець, керамограніт…" oninput="onSearch()">
</div>

<p class="ozd-info">Комплектація від <a href="https://cas-develop.com/">CAS Development</a> — дизайн, ремонт під ключ і постачання напряму з Китаю. Ціни орієнтовні: остаточну вартість, наявність і строк менеджер підтверджує після заявки.</p>
<p class="vhead">Що комплектуємо</p>
<nav class="venues" id="venues"></nav>

<nav class="tabs">
  <button class="tab" id="tabCatalog" onclick="setTab('catalog')">Каталог</button>
  <button class="tab" id="tabBundles" onclick="setTab('bundles')">Комплекти</button>
  <button class="tab" id="tabFav" onclick="setTab('fav')">Обране</button>
</nav>

<div id="viewCatalog">
  <nav class="chips" id="chips"></nav>
  <div class="sortrow">
    <span class="cnt" id="cnt"></span>
    <select id="sort" onchange="renderGrid()">
      <option value="pop">Спочатку ходові</option>
      <option value="asc">Дешевші спершу</option>
      <option value="desc">Дорожчі спершу</option>
      <option value="az">За назвою</option>
    </select>
  </div>
  <main class="grid" id="grid"></main>
</div>

<div id="viewBundles" hidden><div class="blist" id="blist"></div></div>
<div id="viewFav" hidden><main class="grid" id="favGrid"></main></div>

<div class="bar" id="bar"><button onclick="openCart()" id="barTxt">Кошик</button></div>
<div class="toast" id="toast"></div>

<div class="scrim" id="scrim" onclick="closeAll()"></div>
<section class="sheet" id="sheetItem" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh-pad" id="itemBody"></div></section>
<section class="sheet" id="sheetBundle" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh-pad" id="bundleBody"></div></section>
<section class="sheet" id="sheetCart" role="dialog" aria-modal="true"><div class="grab"></div><div class="sh-pad" id="cartBody"></div></section>

const byId = id => IT.find(i => i.id === id);
const CS = i => DATA.colorsets[i.cs];
const SS = i => i.ss ? DATA.sizesets[i.ss] : null;
const defS = i => { const s = SS(i); if(!s) return 0; const n = s.findIndex(x=>x[1]===1); return n<0?0:n; };
const r10 = n => Math.round(n/10)*10;
function price(i, ci=0, si=null){
  const s = SS(i), k = s ? s[si==null?defS(i):si][1] : 1;
  return r10(i.price * k * (1 + CS(i)[ci][2]));
}
const minP = i => { const s=SS(i); return s ? r10(i.price*Math.min(...s.map(x=>x[1]))) : price(i); };
const money = n => new Intl.NumberFormat('uk-UA').format(Math.round(n)) + ' ₴';

/* світлішаємо темні кольори, щоб лінійна графіка лишалась читаною на темному тлі */
function vis(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const L=(.299*r+.587*g+.114*b)/255;
  if(L>=.38) return hex;
  const m=t=>Math.round(t+(168-t)*(.38-L)/.38);
  return '#'+[m(r),m(g),m(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

/* ===================== рендер каркаса ===================== */
function venueCount(v){ return v==='all' ? IT.length : IT.filter(i=>i.vn.includes(v)).length; }

      ${VICON[v]}<b>${label}</b><em>${venueCount(v)} позицій</em></button>`).join('');
}
function setVenue(v){ venue=v; cat='Усе'; renderVenues(); renderChips(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

function pool(){ return venue==='all' ? IT : IT.filter(i=>i.vn.includes(venue)); }
function cats(){ return ['Усе', ...[...new Set(pool().map(i=>i.cat))]]; }
function renderChips(){
  document.getElementById('chips').innerHTML = cats().map(c=>

}
function setCat(c){ cat=c; renderChips(); renderGrid(); }

function setTab(t){

    document.getElementById('view'+k[0].toUpperCase()+k.slice(1)).hidden = (k!==t);
    document.getElementById('tab'+k[0].toUpperCase()+k.slice(1)).setAttribute('aria-pressed', k===t);

}

/* ===================== картки ===================== */
function cardHTML(i){
  const s=SS(i), from = s ? 'від ' : '';
  return `<article class="card" onclick="openItem(${i.id})">
    <div class="tile">${ART[i.art]||''}
      <button class="heart ${fav.has(i.id)?'on':''}" onclick="event.stopPropagation();toggleFav(${i.id})" aria-label="В обране">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-9.7A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7 3.3C19 15.4 12 20 12 20z"/></svg></button>
    </div>

      <div class="nm">${i.name}</div>
      <div class="sw">${CS(i).slice(0,5).map(c=>`<i style="background:${c[1]}"></i>`).join('')}</div>
      <div class="pr">${from}${money(minP(i))} <small>/ ${i.unit}</small></div>
    </div></article>`;
}
function renderGrid(){
  let list = pool();
  if(cat!=='Усе') list = list.filter(i=>i.cat===cat);
  if(query) list = list.filter(i=>(i.name+' '+i.sub+' '+i.en+' '+i.desc).toLowerCase().includes(query));
  const s=document.getElementById('sort').value;
  const ord={A:0,B:1,C:2};
  list=[...list].sort((a,b)=>
    s==='asc'? minP(a)-minP(b) : s==='desc'? minP(b)-minP(a) :
    s==='az'?  a.name.localeCompare(b.name,'uk') : (ord[a.prio]-ord[b.prio])||(minP(b)-minP(a)));
  document.getElementById('cnt').textContent = list.length ? `${list.length} позицій` : '';
  document.getElementById('grid').innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="empty" style="grid-column:1/-1">Нічого не знайшли. Спробуйте інше слово або зніміть фільтр приміщення.</div>`;
}
function renderFav(){
  const list = IT.filter(i=>fav.has(i.id));
  document.getElementById('favGrid').innerHTML = list.length ? list.map(cardHTML).join('')
    : `<div class="empty" style="grid-column:1/-1">Обране порожнє.<br>Тисніть сердечко на картці — позиції збережуться тут, щоб зібрати добірку для клієнта.</div>`;
}

  toast(fav.has(id) ? 'Додано в обране' : 'Прибрано з обраного');
}

/* ===================== комплекти ===================== */
function bundleTotal(b, qty){
  return b.rows.reduce((s,r,n)=>{ const q = qty ? (qty[n] ?? r.q) : r.q; return s + price(byId(r.id),0,defS(byId(r.id)))*q; },0);
}
function renderBundles(){
  const list = venue==='all' ? BU : BU.filter(b=>b.venue===venue);
  document.getElementById('blist').innerHTML = list.length ? list.map(b=>{
    const t=bundleTotal(b), d=Math.round(t*.92);
    return `<article class="bcard" onclick="openBundle('${b.id}')">
      <div class="art">${ART[b.art]||''}</div>
      <div class="info"><h3>${b.name}</h3><div class="note">${b.note}</div>
        <div class="pr">${money(d)} <s>${money(t)}</s></div></div></article>`;
  }).join('') : `<div class="empty">Для цього типу приміщення готового комплекту ще немає. Зберіть з каталогу — або напишіть нам, порахуємо під ваш обʼєкт.</div>`;
}
function openBundle(id){
  const b=BU.find(x=>x.id===id); bq={}; b.rows.forEach((r,n)=>bq[n]=r.q);
  renderBundle(id); open('sheetBundle');
}
function renderBundle(id){
  const b=BU.find(x=>x.id===id);
  const t=bundleTotal(b,bq), d=Math.round(t*.92);
  const n0=b.rows.filter((r,n)=>bq[n]>0).length;
  document.getElementById('bundleBody').innerHTML = `
    <div class="sh-head"><h2>${b.name}</h2><button class="x" onclick="closeAll()">✕</button></div>
    <p class="desc">${b.note} Кількості — орієнтовні, міняйте під свій обʼєкт: позиція з нулем у комплект не піде.</p>
    ${b.rows.map((r,n)=>{ const i=byId(r.id); return `
      <div class="ci">
        <div class="art">${ART[i.art]||''}</div>
        <div class="info"><b>${i.name}</b><em>${money(price(i,0,defS(i)))} / ${i.unit}</em></div>
        <div class="right">
          <span class="s">${money(price(i,0,defS(i))*(bq[n]||0))}</span>
          <div class="qty sm"><button onclick="bqSet('${id}',${n},-1)">−</button><span>${bq[n]||0}</span><button onclick="bqSet('${id}',${n},1)">+</button></div>
        </div></div>`; }).join('')}
    <div class="sum"><span>${n0} позицій, без знижки</span><span>${money(t)}</span></div>
    <div class="sum disc"><span>Знижка за комплект, 8%</span><span>−${money(t-d)}</span></div>
    <div class="sum total"><span>Разом</span><span>${money(d)}</span></div>
    <button class="btn" onclick="addBundle('${id}')">Додати комплект у кошик</button>`;
}
function bqSet(id,n,dd){ bq[n]=Math.max(0,(bq[n]||0)+dd); renderBundle(id); }
function addBundle(id){
  const b=BU.find(x=>x.id===id); let added=0;
  b.rows.forEach((r,n)=>{ const q=bq[n]||0; if(!q) return;
    const i=byId(r.id), si=defS(i);
    const ex=cart.find(c=>c.id===i.id&&c.ci===0&&c.si===si);
    ex ? ex.qty+=q : cart.push({id:i.id,ci:0,si,qty:q}); added++;
  });
  if(!added){ toast('Усі позиції на нулі — нічого додавати'); return; }
  promo={code:'КОМПЛЕКТ',pct:8};
  haptic('success'); closeAll(); syncBadges(); toast(`Комплект додано: ${added} позицій, знижка 8%`);
}

/* ===================== картка товару ===================== */
function openItem(id){ cur=byId(id); curC=0; curS=defS(cur); curQ=1; renderItem(); open('sheetItem'); }
function renderItem(){
  const i=cur, cs=CS(i), s=SS(i);
  const p=price(i,curC,curS), part=Math.ceil(p*curQ/4);
  document.getElementById('itemBody').innerHTML = `
    <div class="sh-head"><h2>${i.name}</h2><button class="x" onclick="closeAll()">✕</button></div>
    <div class="hero-art"><span style="color:${vis(cs[curC][1])};display:contents">${ART[i.art]||''}</span></div>
    <p class="desc">${i.desc}</p>
    <div class="meta"><span class="tag">${i.sub}</span><span class="tag">Ціна за 1 ${i.unit}</span><span class="tag">Поставка 35–50 днів</span></div>

    <p class="lbl">Колір і фактура <b>${cs[curC][0]}</b></p>
    <div class="swatches">${cs.map((c,n)=>`<button class="swatch" style="background:${c[1]}" aria-pressed="${n===curC}" title="${c[0]}" aria-label="${c[0]}" onclick="setC(${n})"></button>`).join('')}</div>

    ${s ? `<p class="lbl">Розмір <b>${s[curS][0]}</b></p>
    <div class="opts">${s.map((x,n)=>`<button class="opt" aria-pressed="${n===curS}" onclick="setS(${n})">${x[0]}<small>${money(price(i,curC,n))}</small></button>`).join('')}</div>` : ''}

    <p class="lbl">Кількість</p>
    <div class="qty"><button onclick="setQ(-1)">−</button><span>${curQ}</span><button onclick="setQ(1)">+</button></div>

    <div class="priceline"><span class="big">${money(p*curQ)}</span>${curQ>1?`<span class="per">${money(p)} × ${curQ}</span>`:''}</div>
    <p class="hint">Або ${money(part)} × 4 платежі без переплати</p>
    <div class="btn2">
      <button class="btn ghost" style="flex:0 0 56px" onclick="toggleFav(${i.id});renderItem()" aria-label="В обране">${fav.has(i.id)?'♥':'♡'}</button>
      <button class="btn" style="flex:1" onclick="addToCart()">Додати в кошик</button>
    </div>`;
}
function setC(n){ curC=n; renderItem(); }
function setS(n){ curS=n; renderItem(); }
function setQ(d){ curQ=Math.max(1,curQ+d); renderItem(); }
function addToCart(){
  const ex=cart.find(c=>c.id===cur.id&&c.ci===curC&&c.si===curS);
  ex ? ex.qty+=curQ : cart.push({id:cur.id,ci:curC,si:curS,qty:curQ});
  haptic(); closeAll(); syncBadges(); toast(`${cur.name} — додано`);
}

/* ===================== кошик ===================== */
const lineSum = c => price(byId(c.id),c.ci,c.si)*c.qty;
const goods = () => cart.reduce((s,c)=>s+lineSum(c),0);
const count = () => cart.reduce((s,c)=>s+c.qty,0);
const discount = () => promo ? Math.round(goods()*promo.pct/100) : 0;
const ship = () => (goods()-discount()) > 20000 ? 0 : 450;
const grand = () => goods()-discount()+ship();

function syncBadges(){
  const n=count(), f=fav.size;
  const cb=document.getElementById('cartBadge'); cb.hidden=!n; cb.textContent=n;
  const fb=document.getElementById('favBadge'); fb.hidden=!f; fb.textContent=f;
  document.getElementById('barTxt').textContent = n ? `Кошик · ${n} шт · ${money(grand())}` : 'Кошик';
  document.getElementById('bar').classList.toggle('show', n>0);
  if(tg&&tg.MainButton){ if(n){ tg.MainButton.setText(`Кошик · ${money(grand())}`); tg.MainButton.show(); } else tg.MainButton.hide(); }
}
function openCart(){ renderCart(); open('sheetCart'); }
function renderCart(){
  const el=document.getElementById('cartBody');
  if(!cart.length){
    el.innerHTML=`<div class="sh-head"><h2>Кошик</h2><button class="x" onclick="closeAll()">✕</button></div>
      <div class="empty">Порожньо. Оберіть позиції в каталозі або візьміть готовий комплект під ваш тип приміщення.</div>
      <button class="btn ghost" onclick="closeAll();setTab('bundles')">Дивитись комплекти</button>`;
    return;
  }
  el.innerHTML=`
    <div class="sh-head"><h2>Кошик</h2><button class="x" onclick="closeAll()">✕</button></div>
    ${cart.map((c,n)=>{ const i=byId(c.id), s=SS(i);
      return `<div class="ci">
        <div class="art"><span style="color:${vis(CS(i)[c.ci][1])};display:contents">${ART[i.art]||''}</span></div>
        <div class="info"><b>${i.name}</b><em>${CS(i)[c.ci][0]}${s?' · '+s[c.si][0]:''} · ${money(price(i,c.ci,c.si))}/${i.unit}</em>
          <div class="qty sm" style="margin-top:6px"><button onclick="cq(${n},-1)">−</button><span>${c.qty}</span><button onclick="cq(${n},1)">+</button></div></div>
        <div class="right"><span class="s">${money(lineSum(c))}</span><button class="rm" onclick="rm(${n})">Прибрати</button></div>
      </div>`; }).join('')}
    <div class="promo">
      <input id="promoIn" placeholder="Промокод" value="${promo?promo.code:''}">
      <button onclick="applyPromo()">Застосувати</button>
    </div>
    <div class="sum"><span>Товари, ${count()} шт</span><span>${money(goods())}</span></div>
    ${promo?`<div class="sum disc"><span>Знижка ${promo.code}, ${promo.pct}%</span><span>−${money(discount())}</span></div>`:''}
    <div class="sum"><span>Доставка по Україні</span><span>${ship()?money(ship()):'безкоштовно'}</span></div>
    <div class="sum total"><span>До сплати</span><span>${money(grand())}</span></div>
    <button class="btn" onclick="openPay()">Оформити замовлення</button>
    <button class="btn ghost" onclick="copyEstimate()">Скопіювати кошторис</button>`;
}
function cq(n,d){ cart[n].qty+=d; if(cart[n].qty<1) cart.splice(n,1); haptic(); syncBadges(); renderCart(); }
function rm(n){ cart.splice(n,1); haptic(); syncBadges(); renderCart(); }
function applyPromo(){
  const v=(document.getElementById('promoIn').value||'').trim().toUpperCase();
  const codes={'ОЗДОБА10':10,'КОМПЛЕКТ':8,'ДИЗАЙНЕР':15};
  if(codes[v]){ promo={code:v,pct:codes[v]}; toast(`Промокод застосовано: −${codes[v]}%`); }
  else { promo=null; toast('Такого промокоду немає'); }
  syncBadges(); renderCart();
}
function copyEstimate(){
  const lines=cart.map(c=>{ const i=byId(c.id), s=SS(i);
    return `${i.name} — ${CS(i)[c.ci][0]}${s?', '+s[c.si][0]:''} — ${c.qty} ${i.unit} × ${money(price(i,c.ci,c.si))} = ${money(lineSum(c))}`; });
  const txt=['КОШТОРИС · Оздоба','',...lines,'',
    `Товари: ${money(goods())}`, promo?`Знижка ${promo.code}: −${money(discount())}`:null,
    `Доставка: ${ship()?money(ship()):'безкоштовно'}`,`РАЗОМ: ${money(grand())}`].filter(Boolean).join('\n');
  const done=()=>toast('Кошторис у буфері обміну');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,()=>fb());
  else fb();
  function fb(){ const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t); t.select();
    try{document.execCommand('copy');done();}catch(e){toast('Не вдалось скопіювати');} t.remove(); }
}

/* ===================== оплата ===================== */
function openPay(){ renderPay(); close('sheetCart'); setTimeout(()=>open('sheetPay'),130); }
function renderPay(){
  const g=grand(), part=Math.ceil(g/4);
  const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  const nm=u?[u.first_name,u.last_name].filter(Boolean).join(' '):'';
  document.getElementById('payBody').innerHTML=`
    <div class="sh-head"><h2>Оформлення заявки</h2><button class="x" onclick="closeAll()">✕</button></div>
    <div class="field"><label>Ім'я та прізвище</label><input id="fName" value="${nm}" placeholder="Ваше імʼя та прізвище"></div>
    <div class="field"><label>Телефон</label><input id="fPhone" type="tel" inputmode="tel" placeholder="+380 __ ___ __ __"></div>
    <div class="field"><label>Місто і відділення Нової Пошти</label><input id="fNp" placeholder="Київ, відділення №12"></div>
    ${payMethod==='invoice'?`<div class="field"><label>Назва компанії та ЄДРПОУ</label><input id="fEdr" placeholder="ТОВ «Приклад», 12345678"></div>`:''}

    <p class="lbl" style="margin-top:18px">Як вам зручніше оплатити</p>
    <button class="pay" aria-pressed="${payMethod==='card'}" onclick="setPay('card')"><span class="dot"></span>
      <span><b>Карткою онлайн</b><small>Посилання на оплату надішле менеджер після підтвердження наявності.</small></span></button>
    <button class="pay" aria-pressed="${payMethod==='parts'}" onclick="setPay('parts')"><span class="dot"></span>
      <span><b>Оплата частинами</b><small>Орієнтовно ${money(part)} × 4 платежі — умови підтвердить менеджер.</small>
      <span class="banks"><i style="background:#8CC63E"></i><i style="background:#101010"></i><i style="background:#E30613"></i></span></span></button>
    <button class="pay" aria-pressed="${payMethod==='invoice'}" onclick="setPay('invoice')"><span class="dot"></span>
      <span><b>Рахунок для ФОП або ТОВ</b><small>Безготівковий розрахунок з ПДВ, закривні документи. Відвантаження після зарахування.</small></span></button>
    <button class="pay" aria-pressed="${payMethod==='cod'}" onclick="setPay('cod')"><span class="dot"></span>
      <span><b>При отриманні</b><small>Наложений платіж. Комісія перевізника 20 ₴ + 2%. Для замовлень до 20 000 ₴.</small></span></button>

    <div class="sum total"><span>Орієнтовна сума</span><span>${money(g)}</span></div>
    <button class="btn" id="sendBtn" onclick="pay()">Надіслати заявку</button>
    <p class="note-honest">Це заявка, а не оплата: гроші зараз не списуються. Менеджер зателефонує, підтвердить наявність,
      ціну й строк поставки і надішле рахунок або посилання на оплату.</p>`;
}
function setPay(m){ payMethod=m; renderPay(); }
async function pay(){
  const v=id=>((document.getElementById(id)||{}).value||'').trim();
  const nm=v('fName'), ph=v('fPhone'), np=v('fNp'), edr=v('fEdr');
  if(!cart.length){ toast('Кошик порожній — додайте товари з каталогу'); return; }
  if(!nm||ph.replace(/\D/g,'').length<9){ toast('Вкажіть імʼя і телефон — інакше ми не зможемо звʼязатися'); return; }
  const g=grand(), ord='OZD-'+Date.now().toString().slice(-7);
  const PM={cod:'при отриманні',parts:'частинами',invoice:'рахунок ФОП/ТОВ',card:'карткою онлайн'};
  const lines=cart.map(c=>{ const i=byId(c.id), s=SS(i);
    return `• ${i.name} — ${CS(i)[c.ci][0]}${s?', '+s[c.si][0]:''} — ${c.qty} ${i.unit} × ${money(price(i,c.ci,c.si))} = ${money(lineSum(c))}`; });
  const message=[`Замовлення ${ord} з Оздоби`,...lines,
    `Товари: ${money(goods())}`, promo?`Знижка ${promo.code}: −${money(discount())}`:null,
    `Доставка: ${ship()?money(ship()):'безкоштовно'}`, `РАЗОМ (орієнтовно): ${money(g)}`,
    `Оплата: ${PM[payMethod]||payMethod}`, np?`Нова Пошта: ${np}`:null, edr?`Компанія/ЄДРПОУ: ${edr}`:null].filter(Boolean).join('\n');
  const btn=document.getElementById('sendBtn'); if(btn){ btn.disabled=true; btn.textContent='Надсилаємо…'; }
  let ok=false;
  try{
    const r=await fetch('https://n8n.china-opt-shop.pp.ua/webhook/contact-form',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:nm,phone:ph,service:'Оздоба — комплектація',area:'',message,source:'cas-develop.com/ozdoba'})});
    ok=r.ok;
  }catch(e){ ok=false; }
  if(!ok){
    if(btn){ btn.disabled=false; btn.textContent='Надіслати заявку'; }
    toast('Не вдалося надіслати. Подзвоніть +380 97 866 77 55 або напишіть нам у Telegram');
    return;
  }
  document.getElementById('payBody').innerHTML=`
    <div class="done"><div class="ring">✓</div>
      <h2 style="font-size:25px;margin-bottom:8px">Заявку ${ord} прийнято</h2>
      <p style="color:var(--muted);font-size:13.5px;margin:0 auto;max-width:34ch">Менеджер звʼяжеться з вами в робочий час,
        підтвердить наявність, ціну й строк поставки і надішле рахунок або посилання на оплату.</p>
      <div class="priceline" style="justify-content:center"><span class="big">${money(g)}</span></div></div>
    <button class="btn ghost" onclick="reset()">До каталогу</button>`;
  haptic('success');
}
function reset(){ cart=[]; promo=null; syncBadges(); closeAll(); render(); }

/* ===================== службове ===================== */
function open(id){ document.getElementById('scrim').classList.add('open');
  document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function close(id){ document.getElementById(id).classList.remove('open'); }
function closeAll(){ ['sheetItem','sheetBundle','sheetCart','sheetPay'].forEach(close);
  document.getElementById('scrim').classList.remove('open'); document.body.style.overflow=''; }
let tt;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2200); }
function render(){ if(tab==='catalog') renderGrid(); else if(tab==='bundles') renderBundles(); else renderFav(); }

if(tg&&tg.MainButton) tg.MainButton.onClick(openCart);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeAll(); });
addEventListener('scroll',()=>document.getElementById('top').classList.toggle('stuck',scrollY>8),{passive:true});

renderVenues(); renderChips(); setTab('catalog'); syncBadges();

</script>
</body>
</html>
