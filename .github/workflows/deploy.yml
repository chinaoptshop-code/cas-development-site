name: 🚀 Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# один деплой за раз; новіший push чекає (старі очікувальні GitHub скасовує сам)
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # Сторінки з JSON (адмінка /kabinet/admin, tools/**/*.json) збираються тут же, перед викладкою — сайт завжди
      # відповідає джерелам, навіть якщо коміт "[rebuild]" (rebuild.yml) ще не зʼявився. Помилка в JSON зупиняє деплой:
      # на сайті лишається попередня версія (як виправити — tools/admin/README.md).
      - name: 🐍 Python + Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'pillow>=11.2' numpy

      - name: 🏗️ Генератори сторінок (tools/build-all.sh)
        run: bash tools/build-all.sh

      - name: 📁 Create Pages project (if not exists)
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"cas-development-site","production_branch":"main"}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Project:', d.get('result',{}).get('name','already exists') if d.get('success') else d.get('errors'))"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 🗄️ Кабінети клієнтів (D1 + секрети; без доступу — сайт деплоїться без кабінетів)
        run: |
          set +e
          npx wrangler@3 d1 list 2>&1 | grep -vE "^[│├└┌]|Account Name|To see token|Logs were written" | tail -12
          ID=$(npx wrangler@3 d1 list --json 2>/dev/null | python3 -c "import sys,json
          try: print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='cas-shop'),''))
          except Exception: print('')")
          if [ -z "$ID" ]; then
            npx wrangler@3 d1 create cas-shop 2>&1 | grep -vE "^[│├└┌]|To see token|Logs were written" | tail -12
            ID=$(npx wrangler@3 d1 list --json 2>/dev/null | python3 -c "import sys,json
          try: print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='cas-shop'),''))
          except Exception: print('')")
          fi
          if [ -n "$ID" ] && sed -i "s/__D1_ID__/$ID/" wrangler.toml && npx wrangler@3 d1 migrations apply cas-shop --remote; then
            echo "D1 cas-shop: $ID"
            for K in TELEGRAM_BOT_TOKEN TELEGRAM_BOT_USERNAME GOOGLE_CLIENT_ID ADMIN_TG_IDS ADMIN_EMAILS GITHUB_CONTENT_TOKEN LEAD_INGEST_KEY; do
              V="${!K}"; [ -n "$V" ] && printf '%s' "$V" | npx wrangler@3 pages secret put "$K" --project-name=cas-development-site >/dev/null 2>&1 && echo "secret $K ok"
            done
          else
            echo "::warning::D1 недоступна (дозволи токена?) — деплой без кабінетів"
            rm -rf functions wrangler.toml
          fi
          exit 0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.SHOP_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.SHOP_TELEGRAM_BOT_USERNAME }}
          GOOGLE_CLIENT_ID: ${{ secrets.SHOP_GOOGLE_CLIENT_ID }}
          ADMIN_TG_IDS: ${{ secrets.SHOP_ADMIN_TG_IDS }}
          ADMIN_EMAILS: ${{ secrets.SHOP_ADMIN_EMAILS }}
          GITHUB_CONTENT_TOKEN: ${{ secrets.SHOP_GITHUB_CONTENT_TOKEN }}   # редактор контенту в /kabinet/admin (tools/admin/README.md)
          LEAD_INGEST_KEY: ${{ secrets.SHOP_LEAD_INGEST_KEY }}             # необовʼязково: ключ для POST /api/leads з n8n

      - name: 📏 UI budget report (tools/ui/ui.py)
        run: python3 tools/ui/ui.py budget --report

      - name: 🖼️ AVIF для зображень (tools/img/picture.py)
        run: python3 tools/img/picture.py

      - name: 🧹 Exclude non-site files (tools, Claude config)
        run: rm -rf tools .claude CLAUDE.md migrations

      - name: 🚀 Deploy with Wrangler
        run: npx wrangler@3 pages deploy . --project-name=cas-development-site --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: ✅ Print URL
        run: echo "Site live at https://cas-development-site.pages.dev"

      # IndexNow (Bing, Yandex, Seznam, Naver …): після викладки повідомляємо про всі URL зі sitemap.xml — нові й змінені
      # сторінки потрапляють в індекс за години, без акаунтів. Ключ — файл <32 hex>.txt у корені сайту (keyLocation).
      # Помилка пінгу деплой не валить (continue-on-error, а мережеві помилки — лише попередження).
      - name: 📣 IndexNow ping
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import glob, json, os, re, urllib.request
          keys = [os.path.basename(f)[:-4] for f in glob.glob('*.txt') if re.fullmatch(r'[0-9a-f]{32}\.txt', os.path.basename(f))]
          if not keys:
              print('IndexNow: немає файлу ключа'); raise SystemExit(0)
          key = keys[0]
          urls = re.findall(r'<loc>(https://cas-develop\.com[^<]*)</loc>', open('sitemap.xml', encoding='utf-8').read())
          urls = [u for u in dict.fromkeys(urls) if '/img/' not in u][:10000]
          body = json.dumps({'host': 'cas-develop.com', 'key': key, 'keyLocation': f'https://cas-develop.com/{key}.txt', 'urlList': urls}).encode()
          req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print('IndexNow:', r.status, len(urls), 'URL')
          except Exception as e:
              print('::warning::IndexNow не відповів:', e)
          PY
