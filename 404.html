<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено — CAS Development</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Manrope:wght@400;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#080709;--tx:#EDE8DF;--mu:#938c84;--ac:#BF9148}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);
  font-family:Manrope,system-ui,sans-serif;padding:24px 16px;text-align:center}
.n{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(84px,22vw,160px);line-height:1;color:var(--ac)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(26px,6vw,38px);margin:8px 0 12px}
p{color:var(--mu);max-width:42ch;margin:0 auto 28px;line-height:1.6}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{color:var(--tx);text-decoration:none;border:1px solid rgba(191,145,72,.45);padding:11px 18px;border-radius:999px;font-size:14px}
a.main{background:var(--ac);color:#140f08;border-color:var(--ac);font-weight:600}
</style>
</head>
<body>
<main>
  <div class="n">404</div>
  <h1>Такої сторінки немає</h1>
  <p>Можливо, посилання застаріло. Почніть з головної або перегляньте наші послуги й роботи.</p>
  <nav>
    <a class="main" href="/">На головну</a>
    <a href="/services">Послуги</a>
    <a href="/portfolio">Портфоліо</a>
    <a href="/contact">Контакти</a>
  </nav>
</main>
</body>
</html>
