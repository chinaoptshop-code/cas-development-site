# Cloudflare Pages + D1 для кабінету клієнтів. database_id підставляє деплой (.github/workflows/deploy.yml).
name = "cas-development-site"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "cas-shop"
database_id = "__D1_ID__"
migrations_dir = "migrations"
